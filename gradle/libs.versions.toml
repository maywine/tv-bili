[versions]
agp = "8.13.2"
kotlin = "2.3.10"
composeBom = "2026.03.01"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.7"
lifecycleViewmodelCompose = "2.8.7"
okhttp = "4.12.0"
retrofit = "2.11.0"
kotlinxSerialization = "1.7.3"
retrofitSerializationConverter = "1.0.0"
datastorePreferences = "1.1.1"
zxingCore = "3.5.3"
coil = "3.0.4"
media3 = "1.5.1"
danmakuFlameMaster = "0.3.8"
brotliDec = "0.1.2"
profileinstaller = "1.4.1"
benchmarkMacro = "1.4.1"
uiautomator = "2.3.0"
testExtJunit = "1.3.0"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",              name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",      version.ref = "activityCompose" }
androidx-compose-bom                 = { group = "androidx.compose",           name = "compose-bom",           version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-datastore-preferences       = { group = "androidx.datastore",         name = "datastore-preferences", version.ref = "datastorePreferences" }
okhttp                               = { group = "com.squareup.okhttp3",       name = "okhttp",                version.ref = "okhttp" }
okhttp-logging-interceptor           = { group = "com.squareup.okhttp3",       name = "logging-interceptor",   version.ref = "okhttp" }
retrofit                             = { group = "com.squareup.retrofit2",     name = "retrofit",              version.ref = "retrofit" }
retrofit-kotlinx-serialization       = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializationConverter" }
kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
zxing-core                           = { group = "com.google.zxing",           name = "core",                  version.ref = "zxingCore" }
coil-compose                         = { group = "io.coil-kt.coil3",           name = "coil-compose",          version.ref = "coil" }
coil-network-okhttp                  = { group = "io.coil-kt.coil3",           name = "coil-network-okhttp",   version.ref = "coil" }
media3-exoplayer                     = { group = "androidx.media3",            name = "media3-exoplayer",      version.ref = "media3" }
media3-exoplayer-hls                 = { group = "androidx.media3",            name = "media3-exoplayer-hls",  version.ref = "media3" }
media3-ui                            = { group = "androidx.media3",            name = "media3-ui",             version.ref = "media3" }
media3-datasource-okhttp             = { group = "androidx.media3",            name = "media3-datasource-okhttp", version.ref = "media3" }
danmaku-flame-master                 = { group = "com.github.ctiao",           name = "DanmakuFlameMaster",    version.ref = "danmakuFlameMaster" }
brotli-dec                           = { group = "org.brotli",                 name = "dec",                   version.ref = "brotliDec" }
androidx-profileinstaller            = { group = "androidx.profileinstaller", name = "profileinstaller",      version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4      = { group = "androidx.benchmark",        name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator            = { group = "androidx.test.uiautomator", name = "uiautomator",           version.ref = "uiautomator" }
androidx-test-ext-junit              = { group = "androidx.test.ext",         name = "junit",                 version.ref = "testExtJunit" }

[plugins]
android-application  = { id = "com.android.application",                  version.ref = "agp" }
android-test         = { id = "com.android.test",                         version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
